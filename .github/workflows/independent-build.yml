name: Independent hosting build check

permissions:
  contents: write

on:
  push:
    branches:
      - migration/cloudflare-audit
  pull_request:
    branches:
      - main
      - migration/cloudflare-audit
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Inventory Higgsfield references
        run: |
          echo '=== Application source references ==='
          grep -RInE '(@higgsfield/|@higgsfield-ai/|higgsfield)' src --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' --include='*.json' --include='*.css' || true
          echo '=== Root and package manifests ==='
          grep -RInE '(@higgsfield/|@higgsfield-ai/|higgsfield|UNLICENSED)' package.json packages --include='package.json' --include='*.ts' --include='*.tsx' --include='*.json' --include='*.css' | head -n 400 || true
      - name: Install dependencies
        run: bun install
      - name: Commit regenerated lockfile if needed
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add bun.lock
            git commit -m 'Refresh lockfile after removing private workspaces'
            git push
          fi
      - name: Run typecheck and production build
        run: bun run build
      - name: Run tests
        run: bun test tests/*.test.ts
