name: Independent hosting build check

on:
  push:
    branches:
      - migration/cloudflare-audit
  pull_request:
    branches:
      - main
      - migration/cloudflare-audit
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run typecheck and production build
        run: bun run build
      - name: Run tests
        run: bun test tests/*.test.ts
