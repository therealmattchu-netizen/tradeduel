name: Deploy TradeDuel preview to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/migration/cloudflare-audit'
    runs-on: ubuntu-latest
    environment: cloudflare-preview
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/cloudflare-audit

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and test
        run: |
          bun run build
          bun test tests/*.test.ts

      - name: Apply D1 migrations to preview database
        run: bunx wrangler@latest d1 migrations apply tradeduel-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy preview Worker
        run: bunx wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
